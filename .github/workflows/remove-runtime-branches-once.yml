name: Remove obsolete runtime branches once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-runtime-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete obsolete runtime branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for branch in \
            group-runtime-v2 \
            group-runtime-v3 \
            group-runtime-v4 \
            group-runtime-v5 \
            group-runtime-v6 \
            group-runtime-v7 \
            group-runtime-v8
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

      - name: Remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-runtime-branches-once.yml
          git commit -m "chore: remove runtime branch cleanup workflow"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
