name: Repair native icon assets once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-icons-fix-once.yml

permissions:
  contents: write

jobs:
  repair-and-prebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deterministic workspace
        run: npm ci
      - name: Install SVG rasterizer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1
      - name: Regenerate app icons from Fantazone vector mark
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import struct
          import zlib
          import cairosvg

          fox = '''
          <g fill="#111111">
            <path d="M500 55 430 245 500 330 570 245z"/><path d="M445 260 225 125 290 350 430 455z"/><path d="M555 260 775 125 710 350 570 455z"/><path d="M435 405 305 345 355 470 450 505z"/><path d="M565 405 695 345 645 470 550 505z"/><path d="M410 350 500 300 590 350 620 500 500 610 380 500z"/><path d="M405 500 500 610 595 500 560 760 500 875 440 760z"/><path d="M470 255 365 45 455 205z"/><path d="M530 255 635 45 545 205z"/>
          </g>
          <g fill="#ffd100">
            <path d="m275 220 145 95 45 100-130-85z"/><path d="m725 220-145 95-45 100 130-85z"/><path d="m457 315 38 25-18 86-48-38z"/><path d="m543 315-38 25 18 86 48-38z"/><path d="m420 625 80 48 80-48-12 62-68 42-68-42z"/><path d="m435 715 65 40 65-40-10 55-55 34-55-34z"/>
          </g>
          <g stroke="#111111" stroke-width="12" stroke-linejoin="round" fill="#ffffff">
            <path d="m500 420 55 38-20 64h-70l-20-64z"/><path d="m445 458 20 64-48 34-44-48 12-60z"/><path d="m555 458-20 64 48 34 44-48-12-60z"/><path d="m465 522 70 0 22 60-57 42-57-42z"/>
          </g>'''

          def svg(adaptive=False):
              background = '<circle cx="500" cy="500" r="450" fill="#ffffff"/>' if adaptive else '<rect width="1000" height="1000" fill="#ffffff"/>'
              return f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">{background}<g transform="translate(0 30) scale(1 .94)">{fox}</g></svg>'

          def verify_png(path: Path):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid PNG signature')
              pos = 8
              while pos < len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  payload = data[pos+8:pos+8+length]
                  expected = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
                  actual = zlib.crc32(kind + payload) & 0xffffffff
                  if actual != expected:
                      raise SystemExit(f'{path}: invalid CRC in {kind!r}')
                  pos += 12 + length
                  if kind == b'IEND':
                      return
              raise SystemExit(f'{path}: missing IEND')

          assets = Path('src/app/assets')
          outputs = [
              ('icon.png', 1024, False),
              ('adaptive-icon.png', 1024, True),
              ('favicon.png', 512, False),
          ]
          for name, size, adaptive in outputs:
              path = assets / name
              cairosvg.svg2png(bytestring=svg(adaptive).encode(), write_to=str(path), output_width=size, output_height=size)
              verify_png(path)
              print(f'{name}: {path.stat().st_size} bytes, PNG CRC valid')
          PY
      - name: Prebuild Android
        working-directory: src/app
        env:
          CI: '1'
        run: npx expo prebuild --no-install --platform android
      - name: Prebuild iOS
        working-directory: src/app
        env:
          CI: '1'
        run: npx expo prebuild --no-install --platform ios
      - name: Commit repaired binary assets
        shell: bash
        run: |
          git config user.name "fantazone-actions[bot]"
          git config user.email "fantazone-actions[bot]@users.noreply.github.com"
          git add src/app/assets/icon.png src/app/assets/adaptive-icon.png src/app/assets/favicon.png
          git diff --cached --check
          git commit -m "fix: regenerate valid native icon assets"
          git pull --rebase origin main
          git push origin HEAD:main
