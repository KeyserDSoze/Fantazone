name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required repository layout
        shell: bash
        run: |
          test -d docs
          test -d src/app
          test -d src/domain
          test -d src/github
          test -d src/jobs
          test -d tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck application
        run: npm run typecheck
