name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify required repository layout
        shell: bash
        run: |
          test -d docs
          test -d src/app
          test -d src/domain
          test -d src/github
          test -d src/jobs
          test -d tests
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Smoke-test PowerShell migration wrapper
        shell: pwsh
        run: |
          $fakeBin = Join-Path $env:RUNNER_TEMP 'fantazone-fake-node'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $fakeNode = Join-Path $fakeBin 'node'
          @'
          #!/usr/bin/env bash
          echo "[fake-node] stdout"
          echo "[fake-node] warning on stderr" >&2
          exit "${FANTAZONE_FAKE_NODE_EXIT:-0}"
          '@ | Set-Content -Path $fakeNode -NoNewline
          & chmod +x $fakeNode

          $env:PATH = "$fakeBin$([IO.Path]::PathSeparator)$env:PATH"
          $env:FANTAZONE_AZURE_CONNECTION_STRING = 'UseDevelopmentStorage=true'
          $env:FANTAZONE_GROUP_PAT = 'test-group-pat'
          $env:FANTAZONE_PLATFORM_PAT = 'test-platform-pat'

          ./scripts/migration/Invoke-FantazoneAzureMigration.ps1 `
            -GroupRepository 'owner/group' `
            -PlatformRepository 'owner/platform' `
            -PreserveExisting `
            -RepairImportedCalendars `
            -Apply

          $env:FANTAZONE_FAKE_NODE_EXIT = '7'
          try {
            ./scripts/migration/Invoke-FantazoneAzureMigration.ps1 `
              -GroupRepository 'owner/group' `
              -PlatformRepository 'owner/platform' `
              -PreserveExisting
            throw 'Expected the wrapper to fail for native exit code 7.'
          }
          catch {
            if ($_.Exception.Message -notmatch 'Migration process failed with exit code 7') { throw }
          }
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck application
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build static web application
        run: npm run export:web --workspace=fantazone-app
      - name: Build and verify offline runtime assets
        shell: bash
        run: |
          npm run build:offline-packs
          test -f src/app/dist/fantazone-push-sw.js
          test -f src/app/dist/offline/serie-a/index.json
          test -n "$(find src/app/dist/offline/serie-a -maxdepth 1 -name '*.json.gz' -print -quit)"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
