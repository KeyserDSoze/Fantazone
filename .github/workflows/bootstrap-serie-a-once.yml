name: Serie A production validation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-serie-a-once.yml

permissions:
  contents: read

jobs:
  diagnose-official-votes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Capture current official-votes HTML contract
        shell: bash
        run: |
          mkdir -p src/jobs/.artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const url = 'https://www.fantacalcio.it/voti-fantacalcio-serie-a/2026-27/2'
          const response = await fetch(url, { headers: {
            'User-Agent': 'Mozilla/5.0 (compatible; Fantazone/1.0; +https://fanta.plus)',
            'Accept-Language': 'it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7',
            'Cache-Control': 'no-cache',
            'Referer': 'https://www.fantacalcio.it/'
          }})
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const html = await response.text()
          fs.writeFileSync('src/jobs/.artifacts/official-day2.html', html)
          const classes = [...html.matchAll(/class=["']([^"']+)["']/gi)].flatMap(m => m[1].split(/\s+/)).filter(Boolean)
          const counts = [...new Set(classes)].map(name => [name, classes.filter(v => v === name).length]).sort((a,b) => b[1]-a[1])
          console.log(`Captured ${html.length} bytes`)
          console.log('Relevant class counts:')
          for (const [name,count] of counts.filter(([name]) => /team|player|vote|rating|bonus|malus|table|row|lineup|match/i.test(name)).slice(0,100)) console.log(`${name}: ${count}`)
          NODE
      - name: Upload provider HTML for parser diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: official-votes-html-${{ github.run_id }}
          path: src/jobs/.artifacts/official-day2.html
          retention-days: 1
