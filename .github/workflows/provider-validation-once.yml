name: Diagnose player images provider once
run-name: Fantazone · diagnose player images provider

on:
  push:
    branches: [main]

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ops: diagnose player images' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Probe Lega Serie A season catalog
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-sdp.legaseriea.it/v1/serie-a/football'
          COMP='serie-a%3A%3AFootball_Competition%3A%3Aec93b94f74294dc98ab5bcfd67fc0d88'

          probe() {
            LABEL="$1"
            LOCALE="$2"
            REFERER="$3"
            URL="$BASE/competitions/$COMP/seasons?locale=$LOCALE"
            echo "===== $LABEL ====="
            ARGS=(-sS -L -A 'Mozilla/5.0 (compatible; Fantazone/1.0; +https://fanta.plus)' -H 'Accept: application/json,text/plain,*/*' -H 'Accept-Language: it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7' -D headers.txt -o body.txt -w '%{http_code}')
            if [ "$REFERER" = 'yes' ]; then
              ARGS+=(-H 'Referer: https://www.legaseriea.it/' -H 'Origin: https://www.legaseriea.it')
            fi
            STATUS="$(curl "${ARGS[@]}" "$URL" || true)"
            echo "HTTP $STATUS"
            grep -iE '^(content-type|server|via|x-|cf-)' headers.txt || true
            echo 'Body preview:'
            head -c 800 body.txt || true
            echo
            echo
          }

          probe 'it-IT current headers' 'it-IT' 'no'
          probe 'en-GB current headers' 'en-GB' 'no'
          probe 'it-IT browser referer' 'it-IT' 'yes'
          probe 'en-GB browser referer' 'en-GB' 'yes'
