name: Validate player images once
run-name: Fantazone · validate player images

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fantazone-platform-background-jobs
  cancel-in-progress: false

env:
  FANTAZONE_PLAYER_IMAGES_API_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_API_BASE_URL }}
  FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL }}

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'ops: harden player images ingestion' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck jobs
        run: npm run typecheck --workspace=@fantazone/jobs
      - name: Run real player image ingestion
        id: images
        shell: bash
        run: |
          set +e
          OUTPUT="$(npm run job --workspace=@fantazone/jobs -- ingest-player-images 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          OK=true
          if [ "$STATUS" -ne 0 ] || printf '%s\n' "$OUTPUT" | grep -q 'skip='; then
            OK=false
          fi
          MATCHES="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\) nuove, \([0-9][0-9]*\) esistenti,.*/\1 \2/p' | tail -1 | awk '{ print $1 + $2 }')"
          MATCHES="${MATCHES:-0}"
          if [ "$MATCHES" -le 0 ]; then OK=false; fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "matches=$MATCHES" >> "$GITHUB_OUTPUT"
          {
            echo '## Player images validation'
            echo
            echo "- Valid: **$OK**"
            echo "- Written/existing matches: **$MATCHES**"
            echo
            echo '```text'
            printf '%s\n' "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit canonical player images
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/app/public/images/players)" ]; then
            echo "No player image changes"
            exit 0
          fi
          git config user.name "fantazone-actions[bot]"
          git config user.email "fantazone-actions[bot]@users.noreply.github.com"
          git add -A -- src/app/public/images/players
          git commit -m "data: ingest player images"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Enforce real-provider validation
        shell: bash
        run: |
          if [ "${{ steps.images.outputs.ok }}" != "true" ]; then
            echo "Player images provider validation failed."
            exit 1
          fi
