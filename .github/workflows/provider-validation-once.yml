name: Validate production Serie A providers once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provider-validation-once.yml

permissions:
  contents: read

concurrency:
  group: fantazone-provider-validation-once
  cancel-in-progress: false

env:
  FANTAZONE_SERIE_A_CALENDAR_BASE_URL: ${{ vars.FANTAZONE_SERIE_A_CALENDAR_BASE_URL }}
  FANTAZONE_PLAYERS_SOURCE_URL: ${{ vars.FANTAZONE_PLAYERS_SOURCE_URL }}
  FANTAZONE_FINAL_VOTES_BASE_URL: ${{ vars.FANTAZONE_FINAL_VOTES_BASE_URL }}
  FANTAZONE_LIVE_SIGNED_URI_URL: ${{ vars.FANTAZONE_LIVE_SIGNED_URI_URL }}
  FANTAZONE_LIVE_RESOURCE_BASE_URL: ${{ vars.FANTAZONE_LIVE_RESOURCE_BASE_URL }}
  FANTAZONE_FANTAGAZZETTA_FORMATIONS_URL: ${{ vars.FANTAZONE_FANTAGAZZETTA_FORMATIONS_URL }}
  FANTAZONE_GAZZETTA_FORMATIONS_URL: ${{ vars.FANTAZONE_GAZZETTA_FORMATIONS_URL }}
  FANTAZONE_INJURY_URL: ${{ vars.FANTAZONE_INJURY_URL }}
  FANTAZONE_PLAYER_IMAGES_API_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_API_BASE_URL }}
  FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL }}

jobs:
  provider:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: live-votes-day-3
            job: ingest-live-votes
            day: '3'
          - label: official-votes-day-2
            job: ingest-final-votes
            day: '2'
          - label: player-odds
            job: ingest-player-odds
            day: ''
          - label: player-images
            job: ingest-player-images
            day: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deterministic workspace
        run: npm ci
      - name: Typecheck jobs
        run: npm run typecheck --workspace=@fantazone/jobs
      - name: Force fresh vote output in validation checkout
        if: matrix.job == 'ingest-live-votes' || matrix.job == 'ingest-final-votes'
        shell: bash
        run: rm -f "data/serie-a/votes/${{ matrix.job == 'ingest-live-votes' && 'live' || 'official' }}/15/${{ matrix.day }}.json"
      - name: Run real provider
        env:
          JOB: ${{ matrix.job }}
          DAY: ${{ matrix.day }}
        run: npm run job --workspace=@fantazone/jobs -- "$JOB" "$DAY" "15"
      - name: Validate vote output
        if: matrix.job == 'ingest-live-votes' || matrix.job == 'ingest-final-votes'
        shell: bash
        env:
          KIND: ${{ matrix.job == 'ingest-live-votes' && 'live' || 'official' }}
          DAY: ${{ matrix.day }}
        run: |
          node - "$KIND" "$DAY" <<'NODE'
          const fs = require('node:fs')
          const [kind, day] = process.argv.slice(2)
          const path = `data/serie-a/votes/${kind}/15/${day}.json`
          if (!fs.existsSync(path)) throw new Error(`Provider did not produce ${path}`)
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'))
          const players = Array.isArray(doc.players) ? doc.players : []
          if (players.length === 0) throw new Error(`${path} contains zero players`)
          const teams = new Set(players.map(p => p?.team?.name).filter(Boolean))
          console.log(`validated ${kind} day ${day}: ${players.length} players, ${teams.size} teams`)
          NODE
      - name: Show canonical changes
        if: always()
        shell: bash
        run: git status --short -- data src/app/public/images/players
