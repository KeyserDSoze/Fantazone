name: Diagnose player catalog pagination once
run-name: Fantazone · diagnose player catalog pagination

on:
  push:
    branches: [main]

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ops: diagnose player catalog pagination' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Probe every player catalog page
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://api-sdp.legaseriea.it/v1/serie-a/football/'
          const headers = {
            'User-Agent': 'Mozilla/5.0 (compatible; Fantazone/1.0; +https://fanta.plus)',
            'Accept-Language': 'it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7',
            'Cache-Control': 'no-cache',
          }
          const seasons = [
            ['current', 'serie-a::Football_Season::ed7fdc2a3e7b408b942ec177b7b956b5', 14],
            ['previous', 'serie-a::Football_Season::5f0e080fc3a44073984b75b3a8e06a8a', 27],
          ]
          for (const [label, id, pages] of seasons) {
            console.log(`===== ${label}: ${pages} pages =====`)
            for (let page = 1; page <= pages; page++) {
              const url = new URL(`seasons/${encodeURIComponent(id)}/stats/players?category=General&page=${page}&locale=it-IT`, base).toString()
              const started = Date.now()
              try {
                const response = await fetch(url, { headers })
                const text = await response.text()
                let players = -1
                let last = null
                try {
                  const parsed = JSON.parse(text)
                  players = Array.isArray(parsed?.players) ? parsed.players.length : -1
                  last = parsed?.pagination?.isLastPage ?? null
                } catch {}
                console.log(`${label} page=${page} status=${response.status} players=${players} last=${last} ms=${Date.now()-started} retry-after=${response.headers.get('retry-after') ?? ''}`)
                if (!response.ok) console.log('body', text.slice(0, 500))
              } catch (error) {
                console.log(`${label} page=${page} FETCH_ERROR`, error, error?.cause)
              }
            }
          }
          NODE
