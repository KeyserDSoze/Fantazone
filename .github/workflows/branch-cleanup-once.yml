name: One-shot stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete safely obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          api="https://api.github.com"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          mapfile -t branches < <(curl -fsSL "${auth[@]}" "${api}/repos/${REPO}/branches?per_page=100" | jq -r '.[].name')
          unresolved=()

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|group-runtime-v*)
                echo "KEEP runtime branch: $branch"
                continue
                ;;
            esac

            safe=false
            reason=""

            case "$branch" in
              chore/pages-action-v6|feat/auction-native-webrtc-integration)
                safe=true
                reason="closed as superseded during cleanup"
                ;;
              docs/azure-blob-migration-guide)
                safe=true
                reason="superseded by merged Azure migration documentation"
                ;;
              feature/live-group-repository)
                safe=true
                reason="abandoned compact LiveGroup implementation superseded by schema-v2 implementation"
                ;;
            esac

            branch_uri=$(jq -rn --arg v "$branch" '$v|@uri')

            if [[ "$safe" != true ]]; then
              compare=$(curl -fsSL "${auth[@]}" "${api}/repos/${REPO}/compare/main...${branch_uri}")
              ahead=$(jq -r '.ahead_by // -1' <<<"$compare")
              if [[ "$ahead" == "0" ]]; then
                safe=true
                reason="branch contains no commits beyond main"
              fi
            fi

            if [[ "$safe" != true ]]; then
              head_uri=$(jq -rn --arg v "${OWNER}:${branch}" '$v|@uri')
              prs=$(curl -fsSL "${auth[@]}" "${api}/repos/${REPO}/pulls?state=all&head=${head_uri}&per_page=100")
              merged_count=$(jq '[.[] | select(.merged_at != null)] | length' <<<"$prs")
              if [[ "$merged_count" -gt 0 ]]; then
                safe=true
                reason="head branch belongs to a merged pull request"
              fi
            fi

            if [[ "$safe" == true ]]; then
              echo "DELETE $branch — $reason"
              curl -fsSL -X DELETE "${auth[@]}" "${api}/repos/${REPO}/git/refs/heads/${branch_uri}"
            else
              echo "KEEP unresolved branch: $branch"
              unresolved+=("$branch")
            fi
          done

          if (( ${#unresolved[@]} > 0 )); then
            printf 'Unresolved branches retained for manual review: %s\n' "${unresolved[*]}"
          fi

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/branch-cleanup-once.yml
          git commit -m "chore: remove one-shot branch cleanup workflow"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
