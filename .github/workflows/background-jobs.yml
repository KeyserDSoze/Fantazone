name: Background jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to execute
        required: true
        type: choice
        options:
          - ingest-serie-a
          - ingest-master-data
          - ingest-live-votes
          - ingest-live
          - ingest-final-votes
          - ingest-player-odds
          - ingest-player-images
          - set-next-formations
          - rebuild-groups
          - rebuild-hall-of-fame
          - process-market
          - recalculate-day
          - recalculate-all
      day:
        description: Optional Serie A/fantasy day
        required: false
        type: string
      season:
        description: Optional season
        required: false
        type: string

permissions:
  contents: write

env:
  FANTAZONE_JOB: ${{ inputs.job }}
  FANTAZONE_DAY: ${{ inputs.day }}
  FANTAZONE_SEASON: ${{ inputs.season }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install job dependencies
        working-directory: src/jobs
        run: npm install
      - name: Run selected job
        working-directory: src/jobs
        run: npm run job -- "$FANTAZONE_JOB" "$FANTAZONE_DAY" "$FANTAZONE_SEASON"
      - name: Upload raw/debug outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantazone-${{ inputs.job }}-${{ github.run_id }}
          path: src/jobs/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit canonical data changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No canonical data changes"
            exit 0
          fi
          git config user.name "fantazone-actions[bot]"
          git config user.email "fantazone-actions[bot]@users.noreply.github.com"
          git add data assets manifest.json
          git commit -m "data: $FANTAZONE_JOB"
          git push
