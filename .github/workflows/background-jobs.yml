name: Background jobs
run-name: "Fantazone · ${{ github.event_name == 'workflow_dispatch' && inputs.job || github.event.schedule == '27 2 * * *' && 'ingest-serie-a' || github.event.schedule == '7 3 * * *' && 'ingest-final-votes' || github.event.schedule == '7 4 * * *' && 'ingest-final-votes' || github.event.schedule == '17 4 * * *' && 'ingest-master-data' || github.event.schedule == '17 5 * * *' && 'ingest-player-odds' || github.event.schedule == '17 3 3 * *' && 'ingest-player-images' || 'ingest-live-votes' }}"

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '27 2 * * *'
    - cron: '7 3 * * *'
    - cron: '7 4 * * *'
    - cron: '17 4 * * *'
    - cron: '17 5 * * *'
    - cron: '17 3 3 * *'
  workflow_dispatch:
    inputs:
      job:
        description: Global platform job to execute
        required: true
        type: choice
        options:
          - bootstrap-serie-a
          - ingest-serie-a
          - ingest-master-data
          - rebuild-player-stats
          - ingest-live-votes
          - ingest-final-votes
          - ingest-player-odds
          - ingest-player-images
      day:
        description: Optional Serie A day
        required: false
        type: string
      season:
        description: Optional internal Fantazone season id (for example 15 = 2026/27)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fantazone-platform-background-jobs
  cancel-in-progress: false

env:
  FANTAZONE_JOB: ${{ github.event_name == 'schedule' && github.event.schedule == '27 2 * * *' && 'ingest-serie-a' || github.event_name == 'schedule' && github.event.schedule == '7 3 * * *' && 'ingest-final-votes' || github.event_name == 'schedule' && github.event.schedule == '7 4 * * *' && 'ingest-final-votes' || github.event_name == 'schedule' && github.event.schedule == '17 4 * * *' && 'ingest-master-data' || github.event_name == 'schedule' && github.event.schedule == '17 5 * * *' && 'ingest-player-odds' || github.event_name == 'schedule' && github.event.schedule == '17 3 3 * *' && 'ingest-player-images' || github.event_name == 'schedule' && 'ingest-live-votes' || inputs.job }}
  FANTAZONE_DAY: ${{ inputs.day }}
  FANTAZONE_SEASON: ${{ inputs.season }}
  FANTAZONE_SERIE_A_CALENDAR_BASE_URL: ${{ vars.FANTAZONE_SERIE_A_CALENDAR_BASE_URL }}
  FANTAZONE_PLAYERS_SOURCE_URL: ${{ vars.FANTAZONE_PLAYERS_SOURCE_URL }}
  FANTAZONE_FINAL_VOTES_BASE_URL: ${{ vars.FANTAZONE_FINAL_VOTES_BASE_URL }}
  FANTAZONE_LIVE_SIGNED_URI_URL: ${{ vars.FANTAZONE_LIVE_SIGNED_URI_URL }}
  FANTAZONE_LIVE_RESOURCE_BASE_URL: ${{ vars.FANTAZONE_LIVE_RESOURCE_BASE_URL }}
  FANTAZONE_FANTAGAZZETTA_FORMATIONS_URL: ${{ vars.FANTAZONE_FANTAGAZZETTA_FORMATIONS_URL }}
  FANTAZONE_GAZZETTA_FORMATIONS_URL: ${{ vars.FANTAZONE_GAZZETTA_FORMATIONS_URL }}
  FANTAZONE_INJURY_URL: ${{ vars.FANTAZONE_INJURY_URL }}
  FANTAZONE_PLAYER_IMAGES_API_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_API_BASE_URL }}
  FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL: ${{ vars.FANTAZONE_PLAYER_IMAGES_MEDIA_BASE_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check whether scheduled live ingestion is needed
        id: live_guard
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$FANTAZONE_JOB" != "ingest-live-votes" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/live-votes-schedule-guard.mjs --github-output >> "$GITHUB_OUTPUT"
          if [ "$(node scripts/live-votes-schedule-guard.mjs)" != "true" ]; then
            echo "No Serie A match is live; skipping dependency install and provider calls."
          fi
      - uses: actions/setup-node@v6
        if: steps.live_guard.outputs.run == 'true'
        with:
          node-version: 22
      - name: Install workspace dependencies
        if: steps.live_guard.outputs.run == 'true'
        run: npm ci
      - name: Typecheck jobs
        if: steps.live_guard.outputs.run == 'true'
        run: npm run typecheck --workspace=@fantazone/jobs
      - name: Refresh canonical calendar for the live Serie A day
        id: live_calendar
        if: github.event_name == 'schedule' && env.FANTAZONE_JOB == 'ingest-live-votes' && steps.live_guard.outputs.run == 'true'
        continue-on-error: true
        run: npm run job --workspace=@fantazone/jobs -- ingest-serie-a "${{ steps.live_guard.outputs.day }}" "${{ steps.live_guard.outputs.season }}"
      - name: Run selected global job
        if: steps.live_guard.outputs.run == 'true'
        run: npm run job --workspace=@fantazone/jobs -- "$FANTAZONE_JOB" "$FANTAZONE_DAY" "$FANTAZONE_SEASON"
      - name: Surface a failed live calendar refresh after preserving live-vote ingestion
        if: always() && github.event_name == 'schedule' && env.FANTAZONE_JOB == 'ingest-live-votes' && steps.live_calendar.outcome == 'failure'
        run: |
          echo "Live votes were still attempted, but the canonical Serie A calendar refresh failed."
          exit 1
      - name: Upload raw/debug outputs
        if: ${{ always() && steps.live_guard.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fantazone-${{ env.FANTAZONE_JOB }}-${{ github.run_id }}
          path: src/jobs/.artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit canonical platform data and static asset changes
        if: steps.live_guard.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data src/app/public/images/players)" ]; then
            echo "No canonical platform data/static image changes"
            exit 0
          fi
          git config user.name "fantazone-actions[bot]"
          git config user.email "fantazone-actions[bot]@users.noreply.github.com"
          git add -A -- data src/app/public/images/players
          git commit -m "data: $FANTAZONE_JOB"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
