name: Validate master data once
run-name: "Fantazone · validate master data"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'force master data now'
    runs-on: ubuntu-latest
    env:
      FANTAZONE_PLAYERS_SOURCE_URL: ${{ vars.FANTAZONE_PLAYERS_SOURCE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck jobs
        run: npm run typecheck --workspace=@fantazone/jobs
      - name: Run real master-data ingestion
        run: npm run job --workspace=@fantazone/jobs -- ingest-master-data
      - name: Commit canonical master data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/serie-a)" ]; then
            echo "No canonical master-data changes"
            exit 0
          fi
          git config user.name "fantazone-actions[bot]"
          git config user.email "fantazone-actions[bot]@users.noreply.github.com"
          git add -A -- data/serie-a
          git commit -m "data: ingest-master-data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
